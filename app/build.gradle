plugins { id 'com.android.application' }

android { namespace 'com.amz.statusly'; compileSdk 35
 defaultConfig { applicationId 'com.amz.statusly'; minSdk 24; targetSdk 35; versionCode 100; versionName '1.0-purepixel' }
 packaging {
   jniLibs { useLegacyPackaging true }
   resources {
      excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
   }
   jniLibs.pickFirsts += [
      'lib/arm64-v8a/libc++_shared.so', 'lib/armeabi-v7a/libc++_shared.so',
      'lib/x86/libc++_shared.so', 'lib/x86_64/libc++_shared.so'
   ]
 }
}

dependencies {
 implementation 'androidx.appcompat:appcompat:1.7.0'
 implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
 implementation 'androidx.cardview:cardview:1.0.0'
 implementation 'androidx.recyclerview:recyclerview:1.3.2'
 implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
 implementation 'com.google.android.material:material:1.12.0'
}
